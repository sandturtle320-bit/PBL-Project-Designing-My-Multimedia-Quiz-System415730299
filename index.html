// 3. 洗牌演算法 (Fisher-Yates Shuffle)
// ----------------------------------------------------
function shuffleArray(array) {
  let arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function draw() {
  background(13, 13, 18);

  if (gameState === 'LANDING') {
    drawLandingPage();
  } else if (gameState === 'MENU') {
    drawCategoryMenu();
  } else if (gameState === 'QUIZ') {

    drawQuizScreen();
  } else if (gameState === 'GAMEOVER') {

  }

  if (showRuleModal) {
    drawRuleModalOverlay();
  }
}

function drawVinylRecord(x, y, size) {
  push();
  translate(x, y);
  vinylAngle += 0.015;
  rotate(vinylAngle);

  fill(20, 20, 25);
  stroke(40);
  strokeWeight(2);
  ellipse(0, 0, size, size);

  noFill();
  stroke(35);
  strokeWeight(1);
  ellipse(0, 0, size * 0.85, size * 0.85);
  ellipse(0, 0, size * 0.70, size * 0.70);
  ellipse(0, 0, size * 0.55, size * 0.55);

  fill(220, 60, 80);
  noStroke();
  ellipse(0, 0, size * 0.35, size * 0.35);

  fill(13, 13, 18);
  ellipse(0, 0, size * 0.08, size * 0.08);
  pop();

  push();
  translate(x + size * 0.45, y - size * 0.65);
  stroke(180);
  strokeWeight(3);
  line(0, 0, -30, 60);
  line(-30, 60, -45, 95);
  fill(220);
  noStroke();
  rect(-50, 95, 10, 15, 2);
  pop();
}

  let startY = 150;
  let lineHeight = 34;

  text("1. 🎧 隨機抽題：每輪隨機挑選 4 首歌曲，選項位置同步隨機洗牌！", 110, startY);
  text("2. ⏱️ 動態評分：點擊播放後開始 20 秒倒數，作答越快得分越高。", 110, startY + lineHeight);
  text("3. 💡 多重提示：可使用「歌詞線索」、「50/50刪錯」或「🔥 解鎖副歌」。", 110, startY + lineHeight * 2);
  text("4. 🧠 知識解鎖：答題後會顯示樂理/文化卡，看完再手動點按跳下一題！", 110, startY + lineHeight * 3);

  fill(140, 160, 190);
  textSize(12);
  text("「讓每一次的測試，都成為一場有價值的音樂探索。」", 110, startY + lineHeight * 4.5);
  pop();
}

function createModalCloseButton() {
  modalCloseBtn = createButton('關閉說明');
  modalCloseBtn.size(140, 38);
  modalCloseBtn.position(width / 2 - 70, 420);
  stylePrimaryButton(modalCloseBtn);
  modalCloseBtn.mousePressed(() => {
    showRuleModal = false;
    modalCloseBtn.remove();
    toggleLandingButtons(true);
  });
}

function toggleLandingButtons(visible) {
  landingButtons.forEach(btn => btn.style('display', visible ? 'block' : 'none'));
}

// ----------------------------------------------------
// 6. 年代選單 (MENU)
// ----------------------------------------------------
function setupCategoryMenu() {
  gameState = 'MENU';
  clearAllButtons();

  let keys = Object.keys(quizCategories);
  let startY = 220;

  keys.forEach((key, index) => {
    let cat = quizCategories[key];
    let btn = createButton(cat.title);
    btn.size(380, 50);
    btn.position(width / 2 - 190, startY + index * 70);
    stylePrimaryButton(btn);
    btn.mousePressed(() => startQuiz(key));
    menuButtons.push(btn);
  });
}

function drawCategoryMenu() {
  textAlign(CENTER);
  fill(255);
  textSize(26);
  text("🎵 請選擇主題年代", width / 2, 110);
  
  textSize(14);
  fill(160, 175, 200);
  text("選擇您想挑戰的音樂時代，開啟探索之旅：", width / 2, 150);
}

// ----------------------------------------------------
// 7. 測驗與 FFT 視覺化 (QUIZ)
// ----------------------------------------------------
function startQuiz(categoryKey) {
  clearAllButtons();
  stopCurrentSound();
  
  isTimerStarted = false;
  quizStartTime = millis(); // ◄◄◄ 記錄進入測驗的時間點（防穿透誤觸）

  currentCategoryKey = categoryKey;
  currentCategory = quizCategories[categoryKey];
  
  let shuffledAll = shuffleArray(currentCategory.questions);
  currentQuiz = shuffledAll.slice(0, min(4, shuffledAll.length));
  
  currentQuestion = 0;
  totalScore = 0;
  gameState = 'QUIZ';
  
  loadQuestion();
}

function loadQuestion() {
  clearQuizButtons();
  if (nextQuestionBtn) {
    nextQuestionBtn.remove();
    nextQuestionBtn = null;
  }

  isAnswered = false;
  isTimerStarted = false;
  timePenalty = 0;
  isTextHintUsed = false;
  isFiftyFiftyUsed = false;
  isChorusHintUsed = false;
  activeHintText = "";

  timeRemaining = MAX_TIME;
  feedbackMessage = "請點擊中央音樂鈕播放試聽，開始試聽與倒數計分！";

  stopCurrentSound();

  createOptionButtons();
  createHintButtons();
}

function stopCurrentSound() {
  currentSoundId++;
  if (soundFile) {
    soundFile.stop();
    soundFile = null;
  }
}

function updateTimer() {
  if (isTimerStarted && !isAnswered) {
    let elapsed = (millis() - timerStartMillis) / 1000;
    timeRemaining = max(0, MAX_TIME - elapsed - timePenalty);

    if (timeRemaining <= 0) {
      handleTimeOut();
    }
  } else if (!isTimerStarted && !isAnswered) {
    timeRemaining = max(0, MAX_TIME - timePenalty);
  }
}

function drawQuizScreen() {
  drawHeaderUI();
  drawSpectrumCircle();

  if (isTextHintUsed && !isAnswered) {
    drawHintBox();
  }

  if (isAnswered) {
    drawKnowledgeCard();
  }
}

function drawHeaderUI() {
  let q = currentQuiz[currentQuestion];
  textAlign(CENTER);
  fill(255);
  textSize(18);
  text(`【${currentCategory.title}】 第 ${currentQuestion + 1} / ${currentQuiz.length} 題  [${q.difficulty}]`, width / 2, 35);

  textSize(14);
  fill(255, 215, 0);
  text(`總得分：${totalScore}`, width / 2 - 220, 68);
  
  fill(timeRemaining < 5 ? '#ff4d4d' : '#4d94ff');
  let timeText = isTimerStarted ? `⏱️ 剩餘時間：${timeRemaining.toFixed(1)} 秒` : `⏱️ 等待播放音樂...`;
  text(timeText, width / 2 + 220, 68);

  noFill();
  stroke(60);
  rect(width / 2 - 150, 60, 300, 8, 4);
  fill(timeRemaining < 5 ? '#ff4d4d' : '#4d94ff');
  noStroke();
  let barWidth = map(timeRemaining, 0, MAX_TIME, 0, 300);
  rect(width / 2 - 150, 60, barWidth, 8, 4);

  textSize(14);
  fill(isAnswered ? '#66ff66' : '#cccccc');
  text(feedbackMessage, width / 2, 98);
}

function drawSpectrumCircle() {
  let spectrum = fft.analyze();
  
  push();
  translate(width / 2, 215);
  noFill();
  strokeWeight(3);
  
  beginShape();
  for (let i = 0; i < spectrum.length; i++) {
    let angle = map(i, 0, spectrum.length, 0, TWO_PI);
    let amp = spectrum[i];
    let r = map(amp, 0, 255, 45, 100);
    let x = r * cos(angle);
    let y = r * sin(angle);
    
    colorMode(HSB);
    stroke(map(i, 0, spectrum.length, 0, 360), 80, 100);
    line(0, 0, x, y);
  }
  endShape(CLOSE);
  
  colorMode(RGB);
  fill(30, 30, 45);
  stroke(255);
  ellipse(0, 0, 80, 80);
  fill(255);
  noStroke();
  textSize(13);
  textAlign(CENTER, CENTER);
  let statusText = soundFile && soundFile.isPlaying() ? (isChorusHintUsed ? "副歌中..." : "播放中...") : "點擊播放";
  text(statusText, 0, 0);
  pop();
}

function drawHintBox() {
  push();
  fill(40, 35, 20, 230);
  stroke(255, 215, 0);
  strokeWeight(1.5);
  rect(100, 115, 520, 45, 8);

  noStroke();
  fill(255, 230, 120);
  textAlign(CENTER, CENTER);
  textSize(13);
  text(`🔍 ${activeHintText}`, width / 2, 137);
  pop();
}

function drawKnowledgeCard() {
  let card = currentQuiz[currentQuestion].knowledgeCard;
  
  push();
  fill(24, 32, 48, 245);
  stroke(70, 130, 240);
  strokeWeight(2);
  rect(50, 100, 620, 95, 10);

  noStroke();
  fill(255, 215, 0);
  textAlign(LEFT, TOP);
  textSize(14);
  textStyle(BOLD);
  text(`💡 知識解鎖：${card.title}`, 70, 112);

  fill(220);
  textSize(12.5);
  textStyle(NORMAL);
  textWrap(CHAR);
  text(card.content, 70, 136, 580, 52);
  pop();
}

function createOptionButtons() {
  let q = currentQuiz[currentQuestion];
  let startY = 380;

  let correctAnswerText = q.options[q.answer];
  let shuffledOptions = shuffleArray(q.options);
  currentCorrectIndex = shuffledOptions.indexOf(correctAnswerText);

  for (let i = 0; i < shuffledOptions.length; i++) {
    let btn = createButton(shuffledOptions[i]);
    btn.size(290, 42);
    let posX = (i % 2 === 0) ? width / 2 - 300 : width / 2 + 10;
    let posY = startY + Math.floor(i / 2) * 52;
    btn.position(posX, posY);
    styleOptionButton(btn);
    
    btn.mousePressed(() => checkAnswer(i));
    quizButtons.push(btn);
  }
}

function createHintButtons() {
  let q = currentQuiz[currentQuestion];

  let textBtn = createButton('💡 歌詞/背景線索 (-3秒)');
  textBtn.size(190, 35);
  textBtn.position(width / 2 - 300, 325);
  styleHintButton(textBtn);
  textBtn.mousePressed(useTextHint);
  hintButtons.push(textBtn);

  let fiftyBtn = createButton('✂️ 刪除兩個錯項 (-5秒)');
  fiftyBtn.size(190, 35);
  fiftyBtn.position(width / 2 - 95, 325);
  styleHintButton(fiftyBtn);
  fiftyBtn.mousePressed(useFiftyFifty);
  hintButtons.push(fiftyBtn);

  let chorusBtn = createButton(q.allowChorusHint ? '🔥 切換高潮副歌 (-5秒)' : '🔒 本題禁止切換副歌');
  chorusBtn.size(190, 35);
  chorusBtn.position(width / 2 + 110, 325);
  styleHintButton(chorusBtn);

  if (!q.allowChorusHint) {
    chorusBtn.attribute('disabled', 'true');
    chorusBtn.style('opacity', '0.4');
    chorusBtn.style('cursor', 'not-allowed');
  } else {
    chorusBtn.mousePressed(useChorusHint);
  }
  hintButtons.push(chorusBtn);
}

function useTextHint() {
  if (isTextHintUsed || isAnswered) return;
  timePenalty += 3;
  isTextHintUsed = true;
  activeHintText = currentQuiz[currentQuestion].hintText;
  
  hintButtons[0].attribute('disabled', 'true');
  hintButtons[0].style('opacity', '0.4');
  feedbackMessage = "已使用文字線索提示！（扣除 3 秒）";
}

function useFiftyFifty() {
  if (isFiftyFiftyUsed || isAnswered) return;
  timePenalty += 5;
  isFiftyFiftyUsed = true;

  let wrongIndices = [];
  for (let i = 0; i < 4; i++) {
    if (i !== currentCorrectIndex) wrongIndices.push(i);
  }

  wrongIndices.sort(() => Math.random() - 0.5);
  let disabledCount = 0;
  for (let idx of wrongIndices) {
    if (disabledCount < 2) {
      quizButtons[idx].attribute('disabled', 'true');
      quizButtons[idx].style('background-color', '#1a1a22');
      quizButtons[idx].style('color', '#555566');
      quizButtons[idx].style('border-color', '#222233');
      quizButtons[idx].style('text-decoration', 'line-through');
      disabledCount++;
    }
  }

  hintButtons[1].attribute('disabled', 'true');
  hintButtons[1].style('opacity', '0.4');
  feedbackMessage = "已刪除兩個錯誤選項！（扣除 5 秒）";
}

function useChorusHint() {
  let q = currentQuiz[currentQuestion];
  if (isChorusHintUsed || isAnswered || !q.allowChorusHint) return;

  timePenalty += 5;
  isChorusHintUsed = true;

  stopCurrentSound();
  let thisSoundId = ++currentSoundId;

  feedbackMessage = "🎵 正在載入高潮副歌音軌...";
  
  soundFile = loadSound(
    q.audioChorusUrl,
    () => {
      if (thisSoundId === currentSoundId) {
        soundFile.loop();
        feedbackMessage = "🔥 已解鎖高潮副歌音軌！（扣除 5 秒）";
      }
    },
    (err) => {
      if (thisSoundId === currentSoundId) {
        console.error("副歌載入失敗：", err);
        feedbackMessage = "⚠️ 副歌音軌載入失敗，請檢查檔案名稱或網路！";
      }
    }
  );

  hintButtons[2].attribute('disabled', 'true');
  hintButtons[2].style('opacity', '0.4');
}

function checkAnswer(selectedIndex) {
  if (isAnswered) return;

  if (selectedIndex === currentCorrectIndex) {
    let scoreGained = Math.round(500 + (timeRemaining / MAX_TIME) * 500);
    totalScore += scoreGained;
    feedbackMessage = `🎉 答對了！獲得 ${scoreGained} 分！閱讀完知識卡後點擊下一題。`;
  } else {
    feedbackMessage = `❌ 猜錯囉！閱讀完知識卡後點擊下一題。`;
  }

  isAnswered = true;
  disableQuizButtons();
  createNextQuestionButton();
}

function handleTimeOut() {
  if (isAnswered) return;
  isAnswered = true;
  feedbackMessage = "⏳ 時間到！未得分。閱讀完知識卡後點擊下一題。";
  disableQuizButtons();
  createNextQuestionButton();
}

function createNextQuestionButton() {
  let isLast = (currentQuestion + 1 >= currentQuiz.length);
  let btnText = isLast ? '🏆 查看結算成績 ➔' : '▶ 下一題 ➔';

  nextQuestionBtn = createButton(btnText);
  nextQuestionBtn.size(190, 40);
  nextQuestionBtn.position(width / 2 + 110, 490);
  styleNextQuestionButton(nextQuestionBtn);

  nextQuestionBtn.mousePressed(() => {
    if (isLast) {
      setupGameOverScreen();
    } else {
      currentQuestion++;
      loadQuestion();
    }
  });
}

function disableQuizButtons() {
  quizButtons.forEach(btn => btn.attribute('disabled', 'true'));
  hintButtons.forEach(btn => btn.attribute('disabled', 'true'));
}

function clearQuizButtons() {
  quizButtons.forEach(btn => btn.remove());
  quizButtons = [];
  hintButtons.forEach(btn => btn.remove());
  hintButtons = [];
  if (nextQuestionBtn) {
    nextQuestionBtn.remove();
    nextQuestionBtn = null;
  }
}

// ----------------------------------------------------
// 8. 結算畫面 (GAMEOVER)
// ----------------------------------------------------
function setupGameOverScreen() {
  gameState = 'GAMEOVER';
  clearQuizButtons();
  stopCurrentSound();

  let retryBtn = createButton('🔄 再挑戰一次');
  retryBtn.size(200, 48);
  retryBtn.position(width / 2 - 210, height / 2 + 80);
  stylePrimaryButton(retryBtn);
  retryBtn.mousePressed(() => {
    startQuiz(currentCategoryKey);
  });
  gameOverButtons.push(retryBtn);

  let menuBtn = createButton('🎵 返回主題選單');
  menuBtn.size(200, 48);
  menuBtn.position(width / 2 + 10, height / 2 + 80);
  styleSecondaryButton(menuBtn);
  menuBtn.mousePressed(setupCategoryMenu);
  gameOverButtons.push(menuBtn);
}

function drawGameOverScreen() {
  textAlign(CENTER, CENTER);
  fill(255);
  textSize(30);
  textStyle(BOLD);
  text("🎉 恭喜完成主題測驗！", width / 2, height / 2 - 60);
  
  textSize(22);
  fill(255, 215, 0);
  text(`【${currentCategory.title}】最終總得分：${totalScore} 分`, width / 2, height / 2);
  
  textSize(15);
  textStyle(NORMAL);
  fill(160, 175, 200);
  text("你已成功透過多媒體互動解鎖本年代的音樂知識！", width / 2, height / 2 + 40);
}

// ----------------------------------------------------
// 9. 通用按鈕樣式與清理工具
// ----------------------------------------------------
function stylePrimaryButton(btn) {
  btn.parent('game-container');
  btn.style('background-color', '#3b82f6');
  btn.style('color', '#ffffff');
  btn.style('border', 'none');
  btn.style('border-radius', '8px');
  btn.style('font-size', '16px');
  btn.style('font-weight', 'bold');
  btn.style('cursor', 'pointer');
}

function styleSecondaryButton(btn) {
  btn.parent('game-container');
  btn.style('background-color', '#1e293b');
  btn.style('color', '#cbd5e1');
  btn.style('border', '1px solid #334155');
  btn.style('border-radius', '8px');
  btn.style('font-size', '16px');
  btn.style('cursor', 'pointer');
}

function styleOptionButton(btn) {
  btn.parent('game-container');
  btn.style('background-color', '#2a2a38');
  btn.style('color', '#ffffff');
  btn.style('border', '1px solid #4a4a68');
  btn.style('border-radius', '6px');
  btn.style('font-size', '15px');
  btn.style('cursor', 'pointer');
}

function styleHintButton(btn) {
  btn.parent('game-container');
  btn.style('background-color', '#1e293b');
  btn.style('color', '#cbd5e1');
  btn.style('border', '1px solid #334155');
  btn.style('border-radius', '20px');
  btn.style('font-size', '12px');
  btn.style('cursor', 'pointer');
}

function styleNextQuestionButton(btn) {
  btn.parent('game-container');
  btn.style('background-color', '#22c55e');
  btn.style('color', '#ffffff');
  btn.style('border', 'none');
  btn.style('border-radius', '8px');
  btn.style('font-size', '15px');
  btn.style('font-weight', 'bold');
  btn.style('cursor', 'pointer');
  btn.style('box-shadow', '0 4px 12px rgba(34, 197, 94, 0.4)');
}

function clearAllButtons() {
  landingButtons.forEach(btn => btn.remove());
  landingButtons = [];
  menuButtons.forEach(btn => btn.remove());
  menuButtons = [];
  gameOverButtons.forEach(btn => btn.remove());
  gameOverButtons = [];
  clearQuizButtons();
  if (modalCloseBtn) modalCloseBtn.remove();
  if (restartButton) {
    restartButton.remove();
    restartButton = null;
  }
}

// ◄◄◄ 畫布點擊事件防誤觸處理
function mousePressed() {
  if (gameState !== 'QUIZ' || showRuleModal) return;

  // ◄◄◄ 關鍵修復：進入測驗未滿 0.3 秒忽略點擊，阻止按選單時的穿透事件！
  if (millis() - quizStartTime < 300) return;

  let d = dist(mouseX, mouseY, width / 2, 215);
  if (d < 40) {
    if (!soundFile) {
      let q = currentQuiz[currentQuestion];
      let urlToPlay = isChorusHintUsed ? q.audioChorusUrl : q.audioMainUrl;
      
      let thisSoundId = ++currentSoundId;
      feedbackMessage = "🎵 正在載入音訊中...";

      soundFile = loadSound(
        urlToPlay,
        () => {
          if (thisSoundId === currentSoundId) {
            soundFile.loop();
            feedbackMessage = "▶️ 音樂播放中...";
            if (!isTimerStarted) {
              isTimerStarted = true;
              timerStartMillis = millis();
            }
          }
        },
        (err) => {
          if (thisSoundId === currentSoundId) {
            console.error("音樂載入失敗：", err);
            feedbackMessage = "⚠️ 音訊檔載入失敗，請檢查檔名或路徑！";
          }
        }
      );
    } else {
      if (soundFile.isPlaying()) {
        soundFile.pause();
        feedbackMessage = "⏸️ 音樂已暫停";
      } else {
        soundFile.play();
        feedbackMessage = "▶️ 音樂播放中...";
        if (!isTimerStarted) {
          isTimerStarted = true;
          timerStartMillis = millis();
        }
      }
    }
  }
}
</script>
